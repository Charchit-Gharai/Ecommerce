<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Order notifications test</title>
</head>
<body style="font-family: sans-serif; max-width: 700px; margin: 2rem auto;">
    <h2>Order notifications test</h2>
    <p>Paste a <b>customer</b> JWT and click Connect.</p>
    <textarea id="token" rows="4" style="width:100%"></textarea>
    <p><button id="connect">Connect</button> <span id="state">disconnected</span></p>
    <h3>Messages</h3>
    <ul id="log"></ul>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
    <script>
    const log = document.getElementById("log");
    const state = document.getElementById("state");

    document.getElementById("connect").onclick = async () => {
      const token = document.getElementById("token").value.trim();

      const connection = new signalR.HubConnectionBuilder()
        .withUrl("/hubs/order-notifications", { accessTokenFactory: () => token })
        .withAutomaticReconnect()
        .build();

      connection.on("OrderStatusChanged", msg => {
        const li = document.createElement("li");
        li.textContent = `${new Date().toLocaleTimeString()}  order ${msg.orderId} is now ${msg.status}`;
        log.prepend(li);
      });

      try {
        await connection.start();
        state.textContent = "connected";
      } catch (e) {
        state.textContent = "failed: " + e;
      }
    };
    </script>
</body>
</html>
