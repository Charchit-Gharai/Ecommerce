# Template only: replace the image with your registry/repository/tag.
# Assumes the existing backend Service is named ecommerce-api on port 8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopkart-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopkart-frontend
  template:
    metadata:
      labels:
        app: shopkart-frontend
    spec:
      containers:
        - name: frontend
          image: YOUR_REGISTRY/shopkart-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shopkart-frontend
spec:
  selector:
    app: shopkart-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
